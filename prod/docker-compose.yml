services:
  discord-bot:
    build: 
      context: .
      args:
        MODE: ${BOT_MODE:-prod}
    container_name: ${CONTAINER_NAME:-cozy-discord-bot}
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_KEY=${API_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    ports:
      - "${API_PORT:-8000}:8000"  # API port exposed from bot container
    volumes:
      # Base volumes always mounted
      - voice-data:/app/data
      - bot-logs:/app/logs
      # Specific environment file
      - ${ENV_FILE_PATH:-/tmp/empty}:/app/.env.local:ro
      # SSL certificates from Let's Encrypt
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - bot-network
    # Default command (can be overridden) - RUNS BOT + API TOGETHER
    command: python3 server.py
    # Conditional health check
    healthcheck:
      test: ["CMD", "python3", "-c", "import discord; print('Bot dependencies OK')"]
      interval: ${HEALTH_CHECK_INTERVAL:-30s}
      timeout: ${HEALTH_CHECK_TIMEOUT:-10s}
      retries: ${HEALTH_CHECK_RETRIES:-3}
      start_period: ${HEALTH_CHECK_START:-40s}
      disable: ${HEALTH_CHECK_DISABLE:-false}


volumes:
  voice-data:
    name: ${VOICE_DATA_VOLUME:-cozy-bot-voice-data}
  bot-logs:
    name: ${VOLUME_NAME:-cozy-bot-logs}

networks:
  bot-network:
    name: ${NETWORK_NAME:-cozy-bot-network}
    driver: bridge