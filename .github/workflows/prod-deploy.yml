name: Production Deploy

on:
  push:
    branches: [ main ]

jobs:
  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - louislam/uptime-kuma:1
          - couchdb:3
          - nginx:alpine
    steps:
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

  sonarqube-scan:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔎 SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=cozy-discord-bot

  deploy:
    needs: [trivy-images, sonarqube-scan]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: 🚀 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}

      - name: 🔑 Add SSH host key
        run: |
          echo "HOME is: $HOME"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -p 22 77.37.87.26 >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: 🛡️ Deploy to Production
        timeout-minutes: 6
        run: |
          ssh -p 22 -o StrictHostKeyChecking=no kitsui@77.37.87.26 bash -s <<'EOF'
          set -euo pipefail
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8
          export TERM=xterm

          echo "🎯 Starting production deployment..."

          cd ~/cozy-bot
          git stash || true
          git checkout main
          git fetch origin
          git reset --hard origin/main

          echo "🚀 Running deployment script..."
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh prod

          echo "✅ Production deployment completed!"
          EOF
