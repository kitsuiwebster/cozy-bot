name: Development Deploy
on:
  push:
    branches: [ dev ]

jobs:
  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - louislam/uptime-kuma:1
          - couchdb:3
          - nginx:alpine
    steps:
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

  sonarqube-scan:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ℹ️ SonarQube skipped (missing credentials)
        if: env.SONAR_TOKEN == '' || env.SONAR_HOST_URL == '' || env.SONAR_PROJECT_KEY == ''
        run: |
          echo "Skipping SonarQube scan: SONAR_TOKEN/SONAR_HOST_URL/SONAR_PROJECT_KEY not configured yet."

      - name: 🔎 SonarQube scan
        if: env.SONAR_TOKEN != '' && env.SONAR_HOST_URL != '' && env.SONAR_PROJECT_KEY != ''
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.projectName=cozy-discord-bot

  deploy:
    needs: [trivy-images, sonarqube-scan]
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: 🚀 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🔑 Add SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2248 90.60.191.159 >> ~/.ssh/known_hosts


      - name: 🛡️ Deploy to Development
        timeout-minutes: 6
        run: |
          ssh -T -o "ServerAliveInterval=5" -o "ServerAliveCountMax=1" -o "ExitOnForwardFailure=yes" -p 2248 kitsui@90.60.191.159 bash -s <<'EOF'
          set -euo pipefail
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8
          export TERM=xterm

          echo "🎯 Starting development deployment..."
          cd ~/cozy-dev/cozy-bot
          git stash || true
          git checkout dev
          git fetch origin
          git reset --hard origin/dev

          echo "🚀 Running deployment script..."
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh dev

          echo "✅ Development deployment completed!"
          EOF
