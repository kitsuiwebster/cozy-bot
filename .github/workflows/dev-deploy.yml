name: Development Deploy
on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: ⚠️ Auto-deploy disabled
        run: |
          echo "⚠️ Automatic development deployment is currently disabled"
          echo "✅ Code pushed to dev branch successfully"
          echo "👉 Deploy manually on VPS using: make dev"
