name: Development Deploy
on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: 🚀 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: 🔑 Add SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2248 90.60.191.159 >> ~/.ssh/known_hosts
      
      - name: 🚀 Deploy to Development
        timeout-minutes: 8
        run: |
          set +e
          timeout 450 ${{ secrets.SSH_COMMAND }} <<'EOF'
          set -euo pipefail
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8
          export TERM=xterm

          echo "🎯 Starting development deployment..."
          cd ~/cozy-bot

          echo "📝 Updating code..."
          git fetch origin dev
          git reset --hard origin/dev

          echo "🔍 Checking environment files..."
          test -f .env.dev

          echo "🚀 Running deployment script..."
          chmod +x deploy-dev.sh
          ./deploy-dev.sh

          echo "✅ Development deployment completed!"
          
          # Force close any background processes
          pkill -f "docker" 2>/dev/null || true
          pkill -f "ssh" 2>/dev/null || true
          
          # Ensure clean exit
          sleep 1
          exec exit 0
          EOF
          SSH_RC=$?
          set -e
          if [ "$SSH_RC" -eq 255 ] || [ "$SSH_RC" -eq 124 ]; then
            echo "ℹ️ SSH closed after remote completion (exit code: $SSH_RC). Treating as success."
            exit 0
          else
            exit "$SSH_RC"
          fi
