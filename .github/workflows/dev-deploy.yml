name: Development Deploy
on:
  push:
    branches: [ dev ]

jobs:
  trivy-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - louislam/uptime-kuma:1
          - couchdb:3
          - nginx:alpine
    steps:
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "0"

  deploy:
    needs: trivy-images
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: 🚀 Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🔑 Add SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2248 90.60.191.159 >> ~/.ssh/known_hosts


      - name: 🛡️ Deploy to Development
        timeout-minutes: 6
        run: |
          ssh -T -o "ServerAliveInterval=5" -o "ServerAliveCountMax=1" -o "ExitOnForwardFailure=yes" -p 2248 kitsui@90.60.191.159 bash -s <<'EOF'
          set -euo pipefail
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8
          export TERM=xterm

          echo "🎯 Starting development deployment..."
          cd ~/cozy-dev/cozy-bot
          git stash || true
          git checkout dev
          git fetch origin
          git reset --hard origin/dev

          echo "🚀 Running deployment script..."
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh dev

          echo "✅ Development deployment completed!"
          EOF
