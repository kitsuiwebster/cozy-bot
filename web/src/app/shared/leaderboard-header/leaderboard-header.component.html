<div class="header">
  <div class="header-content">
    <div class="bot-info">
      <div class="bot-avatar">
        <img [src]="avatarSrc" alt="CozyBot Logo" />
      </div>
      <div class="bot-details">
        <h1 [class.animating]="animatingTitle">{{ title }}</h1>
        <p class="bot-description">{{ subtitle }}</p>

        <div *ngIf="showViewSelector" class="view-selector">
          <select [(ngModel)]="selectedView" (change)="onViewChange()" class="view-select">
            <option *ngFor="let option of viewOptions" [value]="option.value">{{ option.label }}</option>
          </select>
          <a *ngIf="showAddToServer"
             [href]="addToServerUrl"
             target="_blank"
             class="add-to-server-btn">
            {{ addToServerLabel }}
          </a>
        </div>

        <div *ngIf="!showViewSelector && showAddToServer" class="add-to-server-section">
          <a [href]="addToServerUrl"
             target="_blank"
             class="add-to-server-btn">
            {{ addToServerLabel }}
          </a>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat-card" *ngFor="let stat of stats">
        <span class="stat-number" [class.animating]="stat.animating">{{ stat.value }}</span>
        <span class="stat-label">{{ stat.label }}</span>
      </div>
    </div>
  </div>
</div>

<div class="live-stats-section">
  <div class="live-stats">
    <div class="live-stat-combined" [class.loading]="statsLoading">
      <span class="live-stat-text">
        <span class="live-stat-number"
              [class.animating]="animatingListeners"
              [class.pulse-glow]="currentListeners > 0">{{ currentListeners }}</span>
        <span class="live-stat-word">{{ currentListeners === 1 ? 'person' : 'people' }} in</span>
        <span class="live-stat-number"
              [class.animating]="animatingServers"
              [class.pulse-glow]="serversWithBot > 0">{{ serversWithBot }}</span>
        <span class="live-stat-word">{{ serversWithBot === 1 ? 'server' : 'servers' }}</span>
      </span>
      <span class="live-stat-label">🎧 listening now</span>
    </div>
  </div>
</div>

<div *ngIf="ctaHref && ctaText" [ngClass]="ctaVariant === 'back' ? 'back-section' : 'points-info-section'">
  <div [ngClass]="ctaVariant === 'back' ? 'back-info' : 'points-info'">
    <a [href]="ctaHref" [ngClass]="ctaVariant === 'back' ? 'back-link' : 'points-link'">{{ ctaText }}</a>
  </div>
</div>
