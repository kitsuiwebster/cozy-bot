<header class="cozy-header">
  <div class="header-content">
    <a routerLink="/cozybot" class="brand">
      <img src="assets/images/cozybot/cozybot-logo3.png" alt="" class="brand-mark" />
      <span class="brand-name">CozyBot</span>
    </a>
    <nav class="main-nav">
      <a routerLink="/cozybot" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">Leaderboard</a>
      <a routerLink="/cozypoints" routerLinkActive="active">CozyPoints</a>
      <a routerLink="/stats" routerLinkActive="active">Stats</a>
      <a href="https://status.cozybot.online" target="_blank" rel="noopener noreferrer">Status</a>
    </nav>
  </div>
</header>
